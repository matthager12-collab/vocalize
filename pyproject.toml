[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocalize-cli"
dynamic = ["version"]
description = "Local-only speech for macOS: reads text and markdown aloud and turns speech into text, entirely on device."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mat" }]
keywords = ["text-to-speech", "local", "kokoro", "cli", "claude-code", "markdown"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/matthager12-collab/vocalize"
Repository = "https://github.com/matthager12-collab/vocalize"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff", "build", "twine"]

[project.scripts]
vocalize = "vocalize.cli:run"

[tool.hatch.version]
path = "vocalize/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vocalize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: needs the local models; runs only with VOCALIZE_EVAL=1"]
