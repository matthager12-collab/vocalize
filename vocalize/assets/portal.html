<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vocalize settings</title>
<style>
/* One stylesheet, in the document, because the portal serves exactly two
   asset files and there is no route for a third. The CSP carries
   `style-src 'self' 'unsafe-inline'` for this block; script stays on
   'self' with no inline script anywhere on the page. Every state the page
   shows is said in words; colour only repeats it. */
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --panel: #f5f6f8;
  --fg: #17181a;
  --muted: #5b6068;
  --line: #c9cdd3;
  --accent: #0b57d0;
  --ok: #14713a;
  --warn: #8a5800;
  --fail: #ad2020;
  --alert-bg: #fdeaea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181c;
    --panel: #1e2126;
    --fg: #e9eaec;
    --muted: #a4abb5;
    --line: #3b414a;
    --accent: #7cadff;
    --ok: #5fd08a;
    --warn: #e0b341;
    --fail: #ff8a80;
    --alert-bg: #3a1f1f;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

code, .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }

.skip { position: absolute; left: -999rem; }
.skip:focus { left: 1rem; top: 1rem; padding: 0.5rem; background: var(--bg); z-index: 2; }

.top {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 2rem;
  align-items: baseline;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--line);
}
.top h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.01em; }
.facts { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; margin: 0; color: var(--muted); font-size: 0.875rem; }
.facts div { display: flex; gap: 0.4rem; }
.facts dt { font-weight: 600; }
.facts dd { margin: 0; }

.banners { padding: 0 1.25rem; }
.banner {
  margin: 0.75rem 0 0;
  padding: 0.75rem 0.9rem;
  border: 1px solid var(--fail);
  border-left-width: 4px;
  border-radius: 6px;
  background: var(--alert-bg);
}
.banner p { margin: 0.25rem 0 0; }
.banner strong { display: block; }
.banner ul { margin: 0.4rem 0 0; padding-left: 1.25rem; }
.banner.mild { border-color: var(--warn); background: var(--panel); }

.savebar {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1rem;
  padding: 0.6rem 1.25rem;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.savebar p { margin: 0; }

main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 20rem;
  gap: 1.5rem;
  align-items: start;
  padding: 1.25rem;
}
@media (max-width: 60rem) { main { grid-template-columns: minmax(0, 1fr); } }

nav.toc ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; margin: 0 0 1rem; padding: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.group { margin: 0 0 2rem; }
section.group > h2 { margin: 0; font-size: 1.15rem; }
section.group > .hint { margin-bottom: 0.5rem; }
h3 { margin: 1.25rem 0 0.25rem; font-size: 0.95rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

.setting, .action-card, .profile {
  margin: 0.6rem 0 0;
  padding: 0.75rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.setting.unsaved { border-left: 4px solid var(--accent); }
.setting.has-error { border-left: 4px solid var(--fail); }
.setting.off { opacity: 0.75; }
.setting > label, .setting legend, .param label { display: block; font-weight: 600; }
fieldset { margin: 0; padding: 0; border: none; min-width: 0; }
legend { padding: 0; }

.badges { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.35rem 0 0; }
.badge {
  padding: 0.05rem 0.5rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.8rem;
}
.badge.unsaved { border-color: var(--accent); color: var(--fg); }

input, select {
  width: 100%;
  max-width: 26rem;
  min-height: 2.5rem;
  margin-top: 0.25rem;
  padding: 0.4rem 0.5rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  font: inherit;
}
input[type="checkbox"] { width: 1.25rem; min-height: 1.25rem; margin: 0 0.5rem 0 0; vertical-align: middle; }
input[type="number"] { max-width: 10rem; }
input[disabled], select[disabled] { opacity: 0.6; }

.check { display: flex; align-items: center; font-weight: 600; }

.hint { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.9rem; }
.note { margin: 0.35rem 0 0; font-size: 0.9rem; }
.bad { margin: 0.35rem 0 0; color: var(--fail); font-size: 0.9rem; font-weight: 600; }
.bad::before { content: "Problem: "; }
.restart { margin: 0.35rem 0 0; color: var(--warn); font-size: 0.9rem; }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
button {
  min-height: 2.5rem;
  padding: 0.4rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  font: inherit;
  cursor: pointer;
}
button:hover:not([disabled]) { border-color: var(--accent); }
button[disabled] { opacity: 0.5; cursor: default; }
button.primary { border-color: var(--accent); font-weight: 600; }
button.danger { border-color: var(--fail); }

ol.items, ul.plain { list-style: none; margin: 0.5rem 0 0; padding: 0; }
ol.items li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem; padding: 0.4rem 0.6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
ol.items li label { font-weight: 400; min-width: 4rem; }
ol.items li input { max-width: 18rem; margin-top: 0; }
.item-name { font-weight: 600; margin-right: auto; }

.param { margin-top: 0.5rem; }
progress { width: 100%; max-width: 26rem; height: 0.9rem; margin-top: 0.4rem; }

aside {
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}
aside header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
aside h2 { margin: 0; font-size: 1rem; }
#rows { list-style: none; margin: 0.75rem 0 0; padding: 0; }
#rows li { padding: 0.6rem 0; border-top: 1px solid var(--line); }
#rows li:first-child { border-top: none; }
.row-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem; }
.row-name { font-weight: 600; }
.row-state { margin-left: auto; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
.ok .row-state { color: var(--ok); }
.warn .row-state { color: var(--warn); }
.fail .row-state { color: var(--fail); }
.row-detail { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.9rem; }
.row-action { display: block; margin-top: 0.3rem; padding: 0.3rem 0.4rem; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); overflow-wrap: anywhere; }

body.dead main, body.dead .savebar { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>

<a class="skip" href="#groups">Skip to the settings</a>

<header class="top">
  <h1>vocalize settings</h1>
  <dl class="facts">
    <div><dt>This page&rsquo;s local address</dt><dd id="page-address">&mdash;</dd></div>
    <div><dt>Config file</dt><dd id="config-path" class="path">&mdash;</dd></div>
  </dl>
</header>

<div class="banners">
  <div id="alert" class="banner" role="alert" hidden></div>
  <div id="config-alert" class="banner" hidden></div>
  <div id="conflict" class="banner" hidden></div>
  <div id="notices" class="banner mild" hidden></div>
  <div id="save-note" class="banner mild" tabindex="-1" hidden></div>
</div>

<div class="savebar">
  <button type="button" id="save" class="primary">Save changes</button>
  <button type="button" id="discard">Undo unsaved edits</button>
  <p id="status" role="status" aria-live="polite"></p>
</div>

<main>
  <div>
    <nav class="toc" id="toc" aria-label="Setting groups"></nav>
    <div id="profile"></div>
    <div id="groups"><p class="hint">Loading&hellip;</p></div>
  </div>

  <aside aria-labelledby="readiness-heading">
    <header>
      <h2 id="readiness-heading">Readiness</h2>
      <button type="button" id="recheck">Re-check</button>
    </header>
    <ol id="rows" role="list"></ol>
    <p id="rows-note" class="hint">Checking&hellip;</p>
  </aside>
</main>

<script src="/portal.js"></script>
</body>
</html>
